name: Daily Scraper

on:
  schedule:
    - cron: '0 2 * * *'   # UTC 2:00
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scraper_v2.py

      - name: Debug last_run file (if exists)
        run: cat data/last_run.txt || echo "last_run.txt not exist"

      - name: Debug data directory
        run: ls -la data/ || echo "data/ empty or not exist"

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data [skip ci]"
            git push https://${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:${GITHUB_REF#refs/heads/}
          fi