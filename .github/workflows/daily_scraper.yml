name: Daily Scraper

on:
  schedule:
    - cron: '0 2 * * *'   # UTC 2:00 = 北京时间 10:00
  workflow_dispatch:       # 允许手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scraper_v2.py

      - name: Run company crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python company_crawler.py

      - name: Generate calendar JSON
        run: python generate_calendar_json.py

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 强制添加所有数据文件（包括被 .gitignore 忽略的 CSV）
          git add -f data/
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data [skip ci]"
            git push https://${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:${GITHUB_REF#refs/heads/}
          fi