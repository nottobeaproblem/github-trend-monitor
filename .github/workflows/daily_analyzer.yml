name: Daily Analyzer

on:
  schedule:
    - cron: '0 3 * * *'   # UTC 3:00 = 北京时间 11:00
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analyzer
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python analyzer.py

      - name: Commit and push metrics
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 强制添加 metrics 目录（即使被 .gitignore 忽略）
          git add -f data/metrics/
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update metrics [skip ci]"
            git push https://${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:${GITHUB_REF#refs/heads/}
          fi